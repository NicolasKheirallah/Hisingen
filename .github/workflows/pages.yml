name: Deploy site
run-name: Deploy site ${{ inputs.expected_version || github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'Scripts/ci-summary.py'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'Scripts/ci-summary.py'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_artifact:
        description: Same-run release artifact containing site/oauth-callback.html and site/updates/appcast.xml
        required: true
        type: string
      expected_version:
        required: true
        type: string
    outputs:
      page_url:
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out validators and callback
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Download verified release site
        if: inputs.release_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release_artifact }}
          path: release-input
      - name: Select release site
        if: inputs.release_artifact != ''
        run: |
          set -euo pipefail
          test -f release-input/site/oauth-callback.html
          test -f release-input/site/updates/appcast.xml
          rm -rf site
          cp -R release-input/site site
      - name: Preserve the latest published feed for callback deployments
        if: inputs.release_artifact == '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir site/updates --clobber
      - name: Validate deployment entry points
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python3 Scripts/ci-summary.py site site --expected-version "$EXPECTED_VERSION"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Save exact production expectations
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-expectations
          overwrite: true
          path: site
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Download exact production expectations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-expectations
          path: expected-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify served OAuth callback, feed and release assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python3 Scripts/ci-summary.py deployed "$PAGE_URL" expected-site --expected-version "$EXPECTED_VERSION"
