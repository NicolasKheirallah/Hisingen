name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag (run this workflow on the same tag ref)"
        required: true
        type: string

permissions:
  contents: read

# The stable feed, latest release and cask form one publication transaction.
concurrency:
  group: release-stable
  cancel-in-progress: false
  queue: max

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require the requested tag ref
        env:
          REQUEST_REF: ${{ github.ref }}
        run: |
          test "$REQUEST_REF" = "refs/tags/$TAG" || { echo 'Dispatch Release on the requested tag ref'; exit 1; }
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.7'
          cache: false
      - name: Verify exact tag, source and version identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(python3 Scripts/release-support.py validate "$TAG")
          python3 Scripts/release-support.py monotonic "$TAG"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install workflow linter
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Validate all portable source checks
        run: sh Scripts/ci-checks.sh portable

  test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            package: true
          - os: macos-26-intel
            arch: x86_64
            package: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HISINGEN_CI_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Select pinned Xcode
        run: sh Scripts/select-xcode.sh
      - name: Restore dependency data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            .build/repositories
            .build/artifacts
          key: release-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Run credential-free deterministic and packaging checks
        env:
          HISINGEN_CI_OUTPUT_DIR: ci-results
        run: sh Scripts/ci-checks.sh macos
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: ci-results
          retention-days: 14
          if-no-files-found: warn

  build:
    needs: [validate, test]
    runs-on: macos-15
    timeout-minutes: 75
    environment: production-release
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Select pinned Xcode
        run: sh Scripts/select-xcode.sh
      - name: Check required production configuration before building
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_TOOLS_SHA256: ${{ vars.SPARKLE_TOOLS_SHA256 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          required = ('MACOS_CERT_P12', 'MACOS_CERT_PASSWORD', 'VOLVO_CLIENT_ID', 'VOLVO_CLIENT_SECRET', 'VOLVO_VCC_API_KEY', 'NOTARY_APPLE_ID', 'NOTARY_TEAM_ID', 'NOTARY_APP_PASSWORD', 'SPARKLE_PUBLIC_ED_KEY', 'SPARKLE_PRIVATE_ED_KEY', 'SPARKLE_TOOLS_SHA256', 'HOMEBREW_TAP_TOKEN')
          missing = [name for name in required if not os.environ.get(name)]
          if missing: raise SystemExit('Missing production configuration: ' + ', '.join(missing))
          PY
      - name: Import signing identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: sh Scripts/release-build.sh signing-setup
      - name: Build and checkpoint signed universal app
        env:
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          POLESTAR_IMAGE_API_KEY: ${{ secrets.POLESTAR_IMAGE_API_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: sh Scripts/release-build.sh build
      - name: Save signed build checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ env.TAG }}
          path: |
            signed-app.zip
            signed-checkpoint.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Remove signing credentials
        if: always()
        run: sh Scripts/release-build.sh signing-cleanup

  notarize:
    needs: [validate, build]
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 55
    environment: production-release
    outputs:
      artifact: release-ready-${{ env.TAG }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Select pinned Xcode
        run: sh Scripts/select-xcode.sh
      - name: Restore signed build checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signed-${{ env.TAG }}
      - name: Restore prior notarization state when retrying this run
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "notary-recovery-$TAG" || echo 'No earlier notarization checkpoint available'
      - name: Import signing identity for the disk image
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: sh Scripts/release-build.sh signing-setup
      - name: Notarize once, package and verify signed updater
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_TOOLS_SHA256: ${{ vars.SPARKLE_TOOLS_SHA256 }}
        run: sh Scripts/release-notarize.sh
      - name: Save final immutable publication input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ready-${{ env.TAG }}
          path: |
            Hisingen.dmg
            Hisingen.zip
            Hisingen.app.zip
            SHA256SUMS
            release-manifest.json
            updates
            site
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Save notarization recovery state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notary-recovery-${{ env.TAG }}
          path: |
            notary-state
            recovery-manifest.json
            Hisingen.dmg
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
      - name: Remove signing credentials
        if: always()
        run: sh Scripts/release-build.sh signing-cleanup

  publish:
    needs: [validate, notarize]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Restore final publication checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.notarize.outputs.artifact }}
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.4.4
        with:
          subject-path: |
            Hisingen.dmg
            Hisingen.zip
            Hisingen.app.zip
            release-manifest.json
      - name: Draft, upload, download-verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh Scripts/release-publish.sh publish

  deploy-pages:
    needs: [validate, notarize, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_artifact: ${{ needs.notarize.outputs.artifact }}
      expected_version: ${{ needs.validate.outputs.version }}

  homebrew-tap:
    needs: [validate, notarize, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-release
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Restore final publication checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.notarize.outputs.artifact }}
      - name: Verify published bytes and update Homebrew monotonically
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: sh Scripts/release-publish.sh tap
