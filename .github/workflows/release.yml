name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      attestations: write
      id-token: write
    environment: production-release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate build configuration
        env:
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_TOOLS_SHA256: ${{ vars.SPARKLE_TOOLS_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$VOLVO_CLIENT_ID" || { echo "VOLVO_CLIENT_ID is required"; exit 1; }
          test -n "$VOLVO_CLIENT_SECRET" || { echo "VOLVO_CLIENT_SECRET is required"; exit 1; }
          test -n "$VOLVO_VCC_API_KEY" || { echo "VOLVO_VCC_API_KEY is required"; exit 1; }
          for secret in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_APP_PASSWORD SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_ED_KEY SPARKLE_TOOLS_SHA256; do
            test -n "${!secret}" || { echo "$secret is required for a secure release"; exit 1; }
          done

      - name: Select available Xcode toolchain
        run: sh Scripts/select-xcode.sh

      - name: Generate production build configuration
        env:
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          POLESTAR_IMAGE_API_KEY: ${{ secrets.POLESTAR_IMAGE_API_KEY }}
        run: sh Scripts/inject-secrets.sh

      - name: Verify version and toolchain
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "Missing Xcode at $DEVELOPER_DIR"; exit 1; }
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vMAJOR.MINOR.PATCH"; exit 1; }
          test "$PLIST_VERSION" = "$TAG_VERSION" || { echo "Info.plist has $PLIST_VERSION but tag is $TAG_VERSION"; exit 1; }
          grep -Fq "## [$TAG_VERSION]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $TAG_VERSION"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "Release tag must point to a commit on main"; exit 1; }
          plutil -lint Resources/Info.plist
          xcodebuild -version
          swift --version

      - name: Test (deterministic suite only — live/remote-command tests excluded)
        run: >-
          swift test --disable-xctest --enable-swift-testing
          --skip Live
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warn-concurrency

      - name: Configure code signing identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "🔒 Importing Apple Developer ID certificate..."
          CERTIFICATE_PATH="$RUNNER_TEMP/hisingen-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/hisingen-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 1800 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY" || { echo "No Developer ID Application identity found in certificate"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Build universal app
        env:
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          POLESTAR_IMAGE_API_KEY: ${{ secrets.POLESTAR_IMAGE_API_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          REQUIRE_SPARKLE_UPDATER=true make app-universal OUTPUT_DIR=. IDENTITY="$IDENTITY" \
            SWIFT_FLAGS="-Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency"

      - name: Verify signature and architectures
        run: |
          set -euo pipefail
          lipo Hisingen.app/Contents/MacOS/Hisingen -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 Hisingen.app
          codesign -dvv Hisingen.app

      - name: Notarize and staple app
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent Hisingen.app notarize-app.zip
          xcrun notarytool submit notarize-app.zip --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PASSWORD" --wait
          xcrun stapler staple Hisingen.app
          xcrun stapler validate Hisingen.app
          spctl --assess --type execute --verbose=2 Hisingen.app

      - name: Package disk image and archives
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          make dmg OUTPUT_DIR=. IDENTITY="$IDENTITY"
          codesign --force --timestamp --sign "$IDENTITY" Hisingen.dmg
          codesign --verify --verbose=2 Hisingen.dmg
          xcrun notarytool submit Hisingen.dmg --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PASSWORD" --wait
          xcrun stapler staple Hisingen.dmg
          xcrun stapler validate Hisingen.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 Hisingen.dmg
          ditto -c -k --keepParent Hisingen.app Hisingen.zip
          ditto -c -k --keepParent Hisingen.app Hisingen.app.zip

          DMG_MOUNT=$(mktemp -d "$RUNNER_TEMP/hisingen-dmg.XXXXXX")
          ZIP_DIR=$(mktemp -d "$RUNNER_TEMP/hisingen-zip.XXXXXX")
          DMG_ATTACHED=false
          cleanup_packages() {
            if $DMG_ATTACHED; then hdiutil detach "$DMG_MOUNT" || true; fi
            rm -rf "$DMG_MOUNT" "$ZIP_DIR"
          }
          trap cleanup_packages EXIT
          # Hosted macOS runners occasionally return "Resource temporarily
          # unavailable" from hdiutil while diskarbitrationd settles; retry.
          for attempt in 1 2 3 4 5 6; do
            if hdiutil attach Hisingen.dmg -nobrowse -readonly -mountpoint "$DMG_MOUNT"; then
              DMG_ATTACHED=true
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "hdiutil attach still failing after $attempt attempts" >&2
              exit 1
            fi
            echo "hdiutil attach attempt $attempt failed; retrying in 5s" >&2
            sleep 5
          done
          codesign --verify --deep --strict --verbose=2 "$DMG_MOUNT/Hisingen.app"
          spctl --assess --type execute --verbose=2 "$DMG_MOUNT/Hisingen.app"
          hdiutil detach "$DMG_MOUNT"
          DMG_ATTACHED=false

          ditto -x -k Hisingen.zip "$ZIP_DIR"
          codesign --verify --deep --strict --verbose=2 "$ZIP_DIR/Hisingen.app"
          spctl --assess --type execute --verbose=2 "$ZIP_DIR/Hisingen.app"
          ditto -x -k Hisingen.app.zip "$ZIP_DIR/app-asset"
          codesign --verify --deep --strict --verbose=2 "$ZIP_DIR/app-asset/Hisingen.app"
          spctl --assess --type execute --verbose=2 "$ZIP_DIR/app-asset/Hisingen.app"
          cleanup_packages
          trap - EXIT
          shasum -a 256 Hisingen.dmg Hisingen.zip Hisingen.app.zip > SHA256SUMS

      - name: Verify release artifacts exist before publishing
        run: |
          set -euo pipefail
          for artifact in Hisingen.dmg Hisingen.zip Hisingen.app.zip SHA256SUMS; do
            test -s "$artifact" || { echo "Missing or empty release artifact: $artifact"; exit 1; }
          done
          shasum -a 256 -c SHA256SUMS

      - name: Download and verify pinned Sparkle release tools
        env:
          SPARKLE_TOOLS_SHA256: ${{ vars.SPARKLE_TOOLS_SHA256 }}
        run: |
          set -euo pipefail
          TOOLS_ARCHIVE="$RUNNER_TEMP/Sparkle-2.9.6.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$TOOLS_ARCHIVE" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          echo "$SPARKLE_TOOLS_SHA256  $TOOLS_ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xJf "$TOOLS_ARCHIVE" -C "$RUNNER_TEMP/sparkle-tools"
          SPARKLE_TOOLS_DIR=$(find "$RUNNER_TEMP/sparkle-tools" -type f -path '*/bin/generate_appcast' -print | head -n 1 | xargs dirname | xargs dirname)
          test -n "$SPARKLE_TOOLS_DIR" && test -x "$SPARKLE_TOOLS_DIR/bin/generate_appcast"
          echo "SPARKLE_TOOLS_DIR=$SPARKLE_TOOLS_DIR" >> "$GITHUB_ENV"

      - name: Generate signed Sparkle appcast and release notes
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          PRIVATE_KEY="$RUNNER_TEMP/hisingen-sparkle-private.key"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | base64 --decode > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"
          node Scripts/verify-sparkle-keypair.mjs "$PRIVATE_KEY"
          sh Scripts/publish-appcast.sh "$SPARKLE_TOOLS_DIR" "${GITHUB_REF_NAME#v}" "$GITHUB_REF_NAME" Hisingen.app.zip updates "$PRIVATE_KEY"
          node Scripts/verify-updater.mjs appcast updates/appcast.xml
          test -s updates/Hisingen.app.md
          rm -f "$PRIVATE_KEY"
          # The key-pair check and appcast structure check fail the release before publication
          # if the feed, enclosure, or release notes are not signed by the embedded key.

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.4.4
        with:
          subject-path: |
            Hisingen.dmg
            Hisingen.zip
            Hisingen.app.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2.2.3
        with:
          files: |
            Hisingen.dmg
            Hisingen.zip
            Hisingen.app.zip
            SHA256SUMS
            updates/appcast.xml
            updates/Hisingen.app.md
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Verify assets were actually attached to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_NAMES=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for artifact in Hisingen.dmg Hisingen.zip Hisingen.app.zip SHA256SUMS appcast.xml Hisingen.app.md; do
            echo "$ASSET_NAMES" | grep -qx "$artifact" || { echo "Release $GITHUB_REF_NAME is missing uploaded asset: $artifact"; exit 1; }
          done

      - name: Publish signed appcast to GitHub Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_PATH="website/public/updates/appcast.xml"
          CONTENT=$(base64 < updates/appcast.xml | tr -d '\n')
          EXISTING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_PATH?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET_PATH" \
              -f message="chore(updates): publish ${GITHUB_REF_NAME} appcast" \
              -f content="$CONTENT" -f branch=main -f sha="$EXISTING_SHA"
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET_PATH" \
              -f message="chore(updates): publish ${GITHUB_REF_NAME} appcast" \
              -f content="$CONTENT" -f branch=main
          fi
          gh workflow run pages.yml --ref main

      - name: Clean temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/hisingen-signing.p12" "$RUNNER_TEMP/hisingen-sparkle-private.key" "$RUNNER_TEMP/Sparkle-2.9.6.tar.xz" notarize-app.zip
          security delete-keychain "$RUNNER_TEMP/hisingen-signing.keychain-db" 2>/dev/null || true

  homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Bump hisingen cask in NicolasKheirallah/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not configured — skipping Homebrew tap update."
            echo "Create a fine-grained personal access token with Contents read/write access to"
            echo "NicolasKheirallah/homebrew-tap and add it as the HOMEBREW_TAP_TOKEN repository"
            echo "secret to enable automatic cask bumps."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          DMG_URL="https://github.com/NicolasKheirallah/Hisingen/releases/download/v${VERSION}/Hisingen.dmg"
          WORK_DIR=$(mktemp -d "$RUNNER_TEMP/hisingen-tap.XXXXXX")
          trap 'rm -rf "$WORK_DIR"' EXIT

          echo "==> Downloading published artifact to hash exactly what users will install"
          curl --fail --silent --location --retry 3 -o "$WORK_DIR/Hisingen.dmg" "$DMG_URL"
          SHA256=$(sha256sum "$WORK_DIR/Hisingen.dmg" | cut -d' ' -f1)
          echo "sha256(Hisingen.dmg @ v${VERSION}) = $SHA256"

          echo "==> Cross-checking against published SHA256SUMS"
          SUMS_URL="https://github.com/NicolasKheirallah/Hisingen/releases/download/v${VERSION}/SHA256SUMS"
          curl --fail --silent --location --retry 3 -o "$WORK_DIR/SHA256SUMS" "$SUMS_URL"
          grep -Fq "$SHA256  Hisingen.dmg" "$WORK_DIR/SHA256SUMS" || {
            echo "Published Hisingen.dmg does not match SHA256SUMS — aborting tap update"; exit 1;
          }

          echo "==> Updating tap"
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/NicolasKheirallah/homebrew-tap.git" \
            "$WORK_DIR/homebrew-tap"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh Scripts/update-homebrew-cask.sh "$VERSION" "$SHA256" "$WORK_DIR/homebrew-tap"

          cd "$WORK_DIR/homebrew-tap"
          if git diff --quiet; then
            echo "Cask already at ${VERSION} with this sha256 — nothing to commit."
            exit 0
          fi
          git add Casks/hisingen.rb
          git commit -m "hisingen ${VERSION}"
          git push
