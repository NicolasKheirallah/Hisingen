name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag (run this workflow on the same tag ref)"
        required: true
        type: string

permissions:
  contents: read

# The stable feed, latest release and cask form one publication transaction.
concurrency:
  group: release-stable
  cancel-in-progress: false
  queue: max

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require the requested tag ref
        env:
          REQUEST_REF: ${{ github.ref }}
        run: |
          test "$REQUEST_REF" = "refs/tags/$TAG" || { echo 'Dispatch Release on the requested tag ref'; exit 1; }
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.7'
          cache: false
      - name: Verify exact tag, source and version identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(python3 Scripts/release-support.py validate "$TAG")
          python3 Scripts/release-support.py monotonic "$TAG"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install pinned linters
        uses: ./.github/actions/install-lint-tools
      - name: Validate all portable source checks
        run: sh Scripts/ci-checks.sh portable

  # The tagged commit is a main commit that CI already tested. When CI's own results for
  # that exact commit are all green, rerunning the same suites here would only repeat them.
  ci-proof:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Look for a complete green CI run on this commit
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: echo "proven=$(python3 Scripts/release-support.py ci-proof "$SHA")" >> "$GITHUB_OUTPUT"

  test:
    needs: [validate, ci-proof]
    if: needs.ci-proof.outputs.proven != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            package: true
          - os: macos-26-intel
            arch: x86_64
            package: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HISINGEN_CI_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          # The source hygiene gate diffs HEAD against its parent. A depth-1 clone
          # has no parent, so it reports the whole tree as newly added.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Select pinned Xcode
        run: sh Scripts/select-xcode.sh
      - name: Restore dependency data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            .build/repositories
            .build/artifacts
          # Restore-only: a publishing workflow never writes a cache that CI later trusts.
          key: dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci-toolchain.json', 'Package.resolved', 'Package.swift') }}
      - name: Run credential-free deterministic and packaging checks
        env:
          HISINGEN_CI_OUTPUT_DIR: ci-results
        run: sh Scripts/ci-checks.sh macos
      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-diagnostics-${{ matrix.os }}-${{ github.run_attempt }}
          path: ci-results
          retention-days: 14
          if-no-files-found: warn

  build:
    needs: [validate, ci-proof, test]
    # `test` is skipped when CI already proved this commit. Anything else but success stops here.
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.ci-proof.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 75
    environment: production-release
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Select pinned Xcode
        run: sh Scripts/select-xcode.sh
      - name: Check required production configuration before building
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_TOOLS_SHA256: ${{ vars.SPARKLE_TOOLS_SHA256 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          required = ('MACOS_CERT_P12', 'MACOS_CERT_PASSWORD', 'VOLVO_CLIENT_ID', 'VOLVO_CLIENT_SECRET', 'VOLVO_VCC_API_KEY', 'NOTARY_APPLE_ID', 'NOTARY_TEAM_ID', 'NOTARY_APP_PASSWORD', 'SPARKLE_PUBLIC_ED_KEY', 'SPARKLE_PRIVATE_ED_KEY', 'SPARKLE_TOOLS_SHA256', 'HOMEBREW_TAP_TOKEN')
          missing = [name for name in required if not os.environ.get(name)]
          if missing: raise SystemExit('Missing production configuration: ' + ', '.join(missing))
          PY
      - name: Import signing identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: sh Scripts/release-build.sh signing-setup
      - name: Build and checkpoint signed universal app
        env:
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          POLESTAR_IMAGE_API_KEY: ${{ secrets.POLESTAR_IMAGE_API_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: sh Scripts/release-build.sh build
      - name: Save signed build checkpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed-${{ env.TAG }}
          path: |
            signed-app.zip
            signed-checkpoint.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Remove signing credentials
        if: always()
        run: sh Scripts/release-build.sh signing-cleanup

  notarize:
    needs: [validate, build]
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 55
    environment: production-release
    outputs:
      artifact: release-ready-${{ env.TAG }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Select pinned Xcode
        run: sh Scripts/select-xcode.sh
      - name: Restore signed build checkpoint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed-${{ env.TAG }}
      - name: Restore prior notarization state when retrying this run
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name "notary-recovery-$TAG" || echo 'No earlier notarization checkpoint available'
      - name: Import signing identity for the disk image
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: sh Scripts/release-build.sh signing-setup
      - name: Notarize once, package and verify signed updater
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_TOOLS_SHA256: ${{ vars.SPARKLE_TOOLS_SHA256 }}
        run: sh Scripts/release-notarize.sh
      - name: Save final immutable publication input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ready-${{ env.TAG }}
          path: |
            Hisingen.dmg
            Hisingen.app.zip
            SHA256SUMS
            release-manifest.json
            updates
            site
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Save notarization recovery state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-recovery-${{ env.TAG }}
          path: |
            notary-state
            recovery-manifest.json
            Hisingen.dmg
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
      - name: Remove signing credentials
        if: always()
        run: sh Scripts/release-build.sh signing-cleanup

  publish:
    needs: [validate, notarize]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Restore final publication checkpoint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notarize.outputs.artifact }}
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.4.4
        with:
          subject-path: |
            Hisingen.dmg
            Hisingen.app.zip
            SHA256SUMS
      - name: Draft, upload, download-verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh Scripts/release-publish.sh publish

  deploy-pages:
    needs: [validate, notarize, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      release_artifact: ${{ needs.notarize.outputs.artifact }}
      expected_version: ${{ needs.validate.outputs.version }}

  # The regenerated Sparkle feed ships in the release artifact, but the checked-in
  # site/updates/appcast.xml seed stayed behind after 3.0.x, so a Pages deploy that falls
  # back to the repository copy would serve a years-old version. This opens the seed as a
  # reviewable PR instead of pushing to main: the maintainer merges it with the release.
  seed-sync:
    needs: [validate, notarize, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: true
          ref: ${{ needs.validate.outputs.sha }}
      - name: Restore final publication checkpoint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notarize.outputs.artifact }}
      - name: Open a PR when the regenerated feed differs from the checked-in seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if cmp -s site/updates/appcast.xml updates/appcast.xml && cmp -s site/updates/Hisingen.app.md updates/Hisingen.app.md; then
            echo "Seed already matches the published feed; nothing to sync."
            exit 0
          fi
          branch="chore/appcast-seed-${TAG#v}"
          git config user.name "hisingen-release-bot"
          git config user.email "noreply@github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch"
          fi
          mkdir -p site/updates
          cp updates/appcast.xml site/updates/appcast.xml
          cp updates/Hisingen.app.md site/updates/Hisingen.app.md
          git add site/updates/appcast.xml site/updates/Hisingen.app.md
          if git diff --cached --quiet; then
            echo "Branch exists with the seed already up to date."
            exit 0
          fi
          git commit -m "chore: sync the appcast seed and notes with the $TAG published feed [skip release]"
          git push origin "$branch"
          gh pr create --head "$branch" --title "chore: appcast seed for $TAG [skip release]" \
            --body "Regenerated by the $TAG release run. Merging keeps the fallback Pages feed current; the feed itself deploys from the release artifact and needs no merge."
          # A pull request opened with GITHUB_TOKEN triggers no workflows, and main requires ci-required.
          gh workflow run ci.yml --ref "$branch"

  homebrew-tap:
    needs: [validate, notarize, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-release
    steps:
      - name: Check out exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Restore final publication checkpoint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notarize.outputs.artifact }}
      - name: Verify published bytes and update Homebrew monotonically
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: sh Scripts/release-publish.sh tap
