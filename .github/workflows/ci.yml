name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows-and-scripts:
    name: lint-workflows-and-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint GitHub Actions workflows
        run: |
          GOPATH="$(go env GOPATH)"
          "$GOPATH/bin/actionlint" -color
      - name: Lint shell scripts
        run: shellcheck Scripts/*.sh

  check-localization:
    name: check-localization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Check localization keys
        run: python3 Scripts/check-localization.py

  check-docs:
    name: check-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Check documentation links and fences
        run: python3 Scripts/check-docs-links.py

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Cache SwiftPM checkout data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/checkouts
          key: ${{ runner.os }}-${{ matrix.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-spm-
      - name: Select available Xcode toolchain
        run: sh Scripts/select-xcode.sh
      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          make doctor
      - name: Generate build configuration
        env:
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          POLESTAR_IMAGE_API_KEY: ${{ secrets.POLESTAR_IMAGE_API_KEY }}
        run: sh Scripts/inject-secrets.sh
      - name: Build with complete concurrency checks
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
      - name: Test deterministic suite
        run: |
          set -euo pipefail
          sh Scripts/test.sh --skip Live -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
      - name: Validate localization and documentation
        run: |
          python3 Scripts/check-localization.py
          python3 Scripts/check-docs-links.py
      - name: Validate repository and release inputs
        run: sh Scripts/validate-release.sh
      - name: Build ad-hoc app bundle
        run: make app IDENTITY="-" SWIFT_FLAGS="-Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency"
      - name: Validate app bundle
        run: |
          set -euo pipefail
          test -x Hisingen.app/Contents/MacOS/Hisingen
          plutil -lint Hisingen.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' Hisingen.app/Contents/Info.plist)" = "true"
          codesign --verify --deep --strict --verbose=2 Hisingen.app
      - name: Build DMG validation artifact
        if: matrix.os == 'macos-15'
        run: |
          set -euo pipefail
          make dmg IDENTITY="-"
          test -s Hisingen.dmg
          hdiutil verify Hisingen.dmg
          shasum -a 256 Hisingen.dmg > Hisingen.dmg.sha256
      - name: Upload DMG validation artifact
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Hisingen-macos-build
          if-no-files-found: error
          path: |
            Hisingen.dmg
            Hisingen.dmg.sha256
