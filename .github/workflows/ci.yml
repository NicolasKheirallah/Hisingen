name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows-and-scripts:
    name: lint-workflows-and-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint GitHub Actions workflows
        run: |
          GOPATH="$(go env GOPATH)"
          "$GOPATH/bin/actionlint" -color
      - name: Lint shell scripts
        run: shellcheck Scripts/*.sh

  check-localization:
    name: check-localization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Check localization keys
        run: python3 Scripts/check-localization.py

  check-docs:
    name: check-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Check documentation links and fences
        run: python3 Scripts/check-docs-links.py

  build-and-test:
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Cache SwiftPM checkout data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/checkouts
          key: ${{ runner.os }}-${{ matrix.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-spm-
      - name: Select available Xcode toolchain
        run: sh Scripts/select-xcode.sh
      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          make doctor
      - name: Generate build configuration
        env:
          VOLVO_CLIENT_ID: ${{ secrets.VOLVO_CLIENT_ID }}
          VOLVO_CLIENT_SECRET: ${{ secrets.VOLVO_CLIENT_SECRET }}
          VOLVO_VCC_API_KEY: ${{ secrets.VOLVO_VCC_API_KEY }}
          POLESTAR_IMAGE_API_KEY: ${{ secrets.POLESTAR_IMAGE_API_KEY }}
        run: sh Scripts/inject-secrets.sh
      - name: Build with complete concurrency checks
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
      - name: Test deterministic suite
        run: |
          set -euo pipefail
          sh Scripts/test.sh --skip Live -Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency
      - name: Validate localization and documentation
        run: |
          python3 Scripts/check-localization.py
          python3 Scripts/check-docs-links.py
      - name: Validate repository and release inputs
        run: sh Scripts/validate-release.sh
      - name: Build ad-hoc app bundle
        run: make app OUTPUT_DIR=. IDENTITY="-" SWIFT_FLAGS="-Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency"
      - name: Validate app bundle
        run: |
          set -euo pipefail
          test -x Hisingen.app/Contents/MacOS/Hisingen
          plutil -lint Hisingen.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' Hisingen.app/Contents/Info.plist)" = "true"
          codesign --verify --deep --strict --verbose=2 Hisingen.app
      - name: Build DMG validation artifact
        if: matrix.os == 'macos-15'
        run: |
          set -euo pipefail
          make dmg OUTPUT_DIR=. IDENTITY="-"
          test -s Hisingen.dmg
          # `hdiutil` on the hosted macos-15 runners intermittently returns
          # "Resource temporarily unavailable" for a few seconds after `hdiutil
          # create`, while diskarbitrationd still holds the freshly written image.
          # Retry before treating a verify failure as a real corruption.
          for attempt in 1 2 3 4 5 6; do
            if hdiutil verify Hisingen.dmg; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "hdiutil verify still failing after $attempt attempts" >&2
              exit 1
            fi
            echo "hdiutil verify attempt $attempt failed; retrying in 5s" >&2
            sleep 5
          done
          shasum -a 256 Hisingen.dmg > Hisingen.dmg.sha256
      - name: Upload DMG validation artifact
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hisingen-macos-build
          if-no-files-found: error
          path: |
            Hisingen.dmg
            Hisingen.dmg.sha256
