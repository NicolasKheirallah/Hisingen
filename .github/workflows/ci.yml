name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.7'
          cache: false
      - name: Install pinned linters
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Run portable validation
        run: sh Scripts/ci-checks.sh portable

  compatibility-checks:
    name: ${{ matrix.check }}
    needs: portable-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        check: [lint-workflows-and-scripts, check-localization, check-docs, check-vin-scoping, check-contrast, check-source-invariants]
    steps:
      - name: Preserve required contexts during protection migration
        run: echo "Shared portable validation succeeded"

  build-and-test:
    needs: portable-checks
    name: build-and-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            package: true
          - os: macos-26-intel
            arch: x86_64
            package: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HISINGEN_BUILD_CONFIGURATION: fixture
      HISINGEN_CI_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Select pinned Xcode
        run: sh Scripts/select-xcode.sh
      - name: Configure diagnostic output
        run: echo "HISINGEN_CI_OUTPUT_DIR=$RUNNER_TEMP/ci-output" >> "$GITHUB_ENV"
      - name: Verify runtime architecture and toolchain
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          swift --version
      - name: Cache dependency repositories and binary artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            .build/repositories
            .build/artifacts
            .build-arm64/repositories
            .build-arm64/artifacts
            .build-x86_64/repositories
            .build-x86_64/artifacts
          key: dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci-toolchain.json', 'Package.resolved', 'Package.swift') }}
      - name: Validate native runtime and universal package
        run: sh Scripts/ci-checks.sh macos
      - name: Write execution summary
        if: always()
        run: python3 Scripts/ci-summary.py summary "$HISINGEN_CI_OUTPUT_DIR"
      - name: Preserve results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ env.HISINGEN_CI_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7

  ci-required:
    name: ci-required
    if: always()
    needs: [portable-checks, build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out gate validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require all validation jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 Scripts/ci-summary.py gate
