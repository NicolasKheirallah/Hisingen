name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift toolchain
        run: xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build
        run: swift build
      - name: Strict concurrency build
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Test
        run: swift test
      - name: Check localization and documentation
        run: |
          python3 Scripts/check-localization.py
          python3 Scripts/check-docs-links.py
      - name: Validate secrets and release inputs
        run: sh Scripts/validate-release.sh
      - name: Build app bundle and disk image
        run: make all IDENTITY="-" SWIFT_FLAGS="-Xswiftc -strict-concurrency=complete -Xswiftc -warn-concurrency"
      - name: Validate signed bundle and disk image
        run: |
          set -euo pipefail
          test -x Hisingen.app/Contents/MacOS/Hisingen
          plutil -lint Hisingen.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 Hisingen.app
          test -s Hisingen.dmg
          hdiutil verify Hisingen.dmg
          shasum -a 256 Hisingen.dmg > Hisingen.dmg.sha256
          shasum -a 256 -c Hisingen.dmg.sha256
