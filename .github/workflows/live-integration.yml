name: Live Account Integration

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to test"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - polestar
          - volvo
      soak_seconds:
        description: "Stream soak duration in seconds (60–1800; longer soaks run locally)"
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: live-account-test
  cancel-in-progress: false
  queue: max

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate hosted soak budget
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: python3 Scripts/ci-summary.py soak "$SOAK_SECONDS"

  live-polestar:
    needs: validate-inputs
    if: inputs.provider == 'all' || inputs.provider == 'polestar'
    runs-on: macos-15
    timeout-minutes: 60
    environment: live-integration
    env:
      HISINGEN_BUILD_CONFIGURATION: fixture
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'

      - name: Select pinned Xcode toolchain
        run: sh Scripts/select-xcode.sh

      - name: Verify Polestar credentials & toolchain
        env:
          HISINGEN_TEST_EMAIL: ${{ secrets.HISINGEN_TEST_EMAIL }}
          HISINGEN_TEST_PASSWORD: ${{ secrets.HISINGEN_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HISINGEN_TEST_EMAIL" || { echo "HISINGEN_TEST_EMAIL is required"; exit 1; }
          test -n "$HISINGEN_TEST_PASSWORD" || { echo "HISINGEN_TEST_PASSWORD is required"; exit 1; }
          swift --version

      - name: Generate build configuration
        run: sh Scripts/inject-secrets.sh

      - name: Run live Polestar account phases sequentially
        env:
          HISINGEN_TEST_EMAIL: ${{ secrets.HISINGEN_TEST_EMAIL }}
          HISINGEN_TEST_PASSWORD: ${{ secrets.HISINGEN_TEST_PASSWORD }}
          HISINGEN_TEST_VIN: ${{ secrets.HISINGEN_TEST_VIN }}
          HISINGEN_SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: |
          set -euo pipefail
          HISINGEN_TEST_OUTPUT_DIR="$RUNNER_TEMP/live-readonly" sh Scripts/test.sh --filter LivePolestarReadOnlyIntegrationTests --no-parallel
          HISINGEN_TEST_OUTPUT_DIR="$RUNNER_TEMP/live-soak" sh Scripts/test.sh --filter LivePolestarStreamSoakTests --no-parallel

  live-volvo:
    needs: validate-inputs
    if: inputs.provider == 'all' || inputs.provider == 'volvo'
    runs-on: macos-15
    timeout-minutes: 30
    environment: live-integration
    env:
      HISINGEN_BUILD_CONFIGURATION: fixture
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'

      - name: Select pinned Xcode toolchain
        run: sh Scripts/select-xcode.sh

      - name: Verify Volvo credentials & toolchain
        env:
          HISINGEN_TEST_VOLVO_CLIENT_ID: ${{ secrets.HISINGEN_TEST_VOLVO_CLIENT_ID }}
          HISINGEN_TEST_VOLVO_CLIENT_SECRET: ${{ secrets.HISINGEN_TEST_VOLVO_CLIENT_SECRET }}
          HISINGEN_TEST_VOLVO_VCC_API_KEY: ${{ secrets.HISINGEN_TEST_VOLVO_VCC_API_KEY }}
          HISINGEN_TEST_VOLVO_REFRESH_TOKEN: ${{ secrets.HISINGEN_TEST_VOLVO_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HISINGEN_TEST_VOLVO_CLIENT_ID" || { echo "HISINGEN_TEST_VOLVO_CLIENT_ID is required"; exit 1; }
          test -n "$HISINGEN_TEST_VOLVO_CLIENT_SECRET" || { echo "HISINGEN_TEST_VOLVO_CLIENT_SECRET is required"; exit 1; }
          test -n "$HISINGEN_TEST_VOLVO_VCC_API_KEY" || { echo "HISINGEN_TEST_VOLVO_VCC_API_KEY is required"; exit 1; }
          test -n "$HISINGEN_TEST_VOLVO_REFRESH_TOKEN" || { echo "HISINGEN_TEST_VOLVO_REFRESH_TOKEN is required"; exit 1; }
          swift --version

      - name: Generate build configuration
        run: sh Scripts/inject-secrets.sh

      - name: Run live Volvo integration tests
        env:
          HISINGEN_TEST_VOLVO_CLIENT_ID: ${{ secrets.HISINGEN_TEST_VOLVO_CLIENT_ID }}
          HISINGEN_TEST_VOLVO_CLIENT_SECRET: ${{ secrets.HISINGEN_TEST_VOLVO_CLIENT_SECRET }}
          HISINGEN_TEST_VOLVO_VCC_API_KEY: ${{ secrets.HISINGEN_TEST_VOLVO_VCC_API_KEY }}
          HISINGEN_TEST_VOLVO_REFRESH_TOKEN: ${{ secrets.HISINGEN_TEST_VOLVO_REFRESH_TOKEN }}
          HISINGEN_TEST_VOLVO_VIN: ${{ secrets.HISINGEN_TEST_VOLVO_VIN }}
        run: sh Scripts/test.sh --filter LiveVolvoReadOnlyIntegrationTests --no-parallel
