name: Cut & Tag Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump type or exact version (e.g. 1.0.0, patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - '1.0.0'

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-and-push:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine next version and create release pull request
        id: versioning
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || true)
          echo "Latest tag found: $LATEST_TAG"

          if [[ "$BUMP" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            NEW_VERSION="$BUMP"
          elif [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="1.0.0"
          else
            RAW_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"
            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch|*)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "New Version: $NEW_VERSION"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          BRANCH="release/v${NEW_VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch $BRANCH already exists; refusing to overwrite it." >&2
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" Resources/Info.plist
          CURRENT_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist 2>/dev/null || echo "0")
          NEXT_BUILD=$((CURRENT_BUILD + 1))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD" Resources/Info.plist

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Resources/Info.plist
          git commit -m "chore(release): bump version to v${NEW_VERSION} (build ${NEXT_BUILD})"
          git checkout -b "$BRANCH"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): bump version to v${NEW_VERSION}" \
            --body "This pull request updates the app version to v${NEW_VERSION}. Merge it after required CI checks pass, then create and push tag v${NEW_VERSION} to start the protected release workflow."
