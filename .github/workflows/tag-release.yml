name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor, major, or an exact stable MAJOR.MINOR.PATCH"
        required: true
        default: patch
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Create or resume release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          gh auth setup-git
          python3 Scripts/release-support.py prepare "$BUMP"
