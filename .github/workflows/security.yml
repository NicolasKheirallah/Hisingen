name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 04:17 UTC every Monday — off-peak, avoids stacking with other scheduled jobs.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (Swift)
    runs-on: macos-26-intel
    # Runs on the Intel runner because CodeQL's Swift extractor is an x86_64 binary: on an
    # arm64 runner the compiler and extractor both run under Rosetta, which extracted the app
    # module at about 15 seconds per file (386 files). Dependencies are compiled before CodeQL
    # starts tracing, so the instrumented build only extracts this repository's own module.
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'

      - name: Select pinned Xcode toolchain
        run: sh Scripts/select-xcode.sh

      - name: Generate fixture build configuration
        env:
          HISINGEN_BUILD_CONFIGURATION: fixture
        run: sh Scripts/inject-secrets.sh

      - name: Restore dependency build
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            .build
          key: codeql-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci-toolchain.json', 'Package.resolved', 'Package.swift') }}

      - name: Build dependencies outside the tracer
        timeout-minutes: 30
        run: swift build --force-resolved-versions

      - name: Save dependency build
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            .build
          key: codeql-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/ci-toolchain.json', 'Package.resolved', 'Package.swift') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual

      - name: Build instrumented source
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codeql-diagnostics"
          # Touching the sources makes SwiftPM recompile only the app module.
          find Sources/Hisingen -name '*.swift' -exec touch {} +
          swift build --force-resolved-versions 2>&1 | tee "$RUNNER_TEMP/codeql-diagnostics/build.log"

      - name: Capture process tree after a failed build
        if: failure() || cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/codeql-diagnostics"
          ps -axo pid,ppid,etime,command > "$RUNNER_TEMP/codeql-diagnostics/processes.log" || true
          # One TRAP file is written per extracted file; the newest entries show where it stopped.
          find "$RUNNER_TEMP/codeql_databases" -name '*.trap*' -exec stat -f '%m %z %N' {} + 2>/dev/null \
            | sort -n > "$RUNNER_TEMP/codeql-diagnostics/traps.log" || true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:swift"

      - name: Preserve instrumented build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-diagnostics
          if-no-files-found: warn
          retention-days: 7
