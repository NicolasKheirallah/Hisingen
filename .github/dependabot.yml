version: 2

updates:
  # Keep pinned commit SHAs in workflows current. Dependabot updates the SHA
  # itself (and the trailing version comment) — pinning is preserved, not lost.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"

  # SwiftPM pins Sparkle and the gRPC/SwiftNIO dependency graph.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      swift-packages:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "swift"

# The npm ecosystem entry for `/website` was removed with the site itself. `site/` is two static
# files with no package manifest, so there is nothing left for a package manager to track.
